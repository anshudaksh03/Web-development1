<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline vs block</title>
</head>

<body>
    <!--  Block elements -->

    <h1>Hello world</h1>
    <h1>Apna college</h1>
    <p>anshu</p>

    <!-- inline elements -->

    <a href="https://www.google.com/"> Google</a>
    <a href="https://www.Instagram.com/"> Instagram</a>
    <img src="https://media.istockphoto.com/id/517188688/photo/mountain-landscape.jpg?s=1024x1024&w=0&k=20&c=z8_rWaI8x4zApNEEG9DnWlGXyDIXe-OmsAyQ5fGPVV8="
        alt="NAture" height="50px">
    <img src="https://media.istockphoto.com/id/517188688/photo/mountain-landscape.jpg?s=1024x1024&w=0&k=20&c=z8_rWaI8x4zApNEEG9DnWlGXyDIXe-OmsAyQ5fGPVV8="
        alt="NAture" height="50px">


    <!--  Div  inline elements-->

    <div>
        <a href="https://www.google.com/"> Google</a>
        <a href="https://www.Instagram.com/"> Instagram</a>
    </div>



    <!--  span in line elements -->

    <span>
        <a href="https://www.google.com/"> Google</a>
        <a href="https://www.Instagram.com/"> Instagram</a>
    </span>

    <!-- horizontal rule h tag -->

<p> hey my name is anshu kumar  </p>
<hr/>
<p>  i am learning web development  </p>
<p>  course with apna college  </p>
</body>

<!-- subscript and supscript  -->

<h1>a <sup>2</sup></h1>
<h1>H <sub>2</sub> O</h1>

<!-- Html entities -->

<h1>this is a &#9733; </h1>



</html>
